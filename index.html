<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Blog preview card</title>
</head>
<body>
    <main>
        <div class="main">
            <div class="card">
                <img class="image" src="assets/images/illustration-article.svg" alt="illustration-article">
                <div class="learning-box">
                    <p>Learning</p>
                </div>
                <div class="publication-date">
                    <p>Published 28 April 2026</p>
                </div>
                <section>
                <div class="text">
                    <h2>HTML & CSS foundations</h2>
                    <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>
                </div>
                </section>
                <div class="blogger-name">
                    <img class="image-avatar" src="assets/images/image-avatar.webp" alt="avatar-image">
                    <p>Civ Lixity </p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
